# kind cluster config — Multi-node: 1 control-plane + 2 workers
# Create cluster: kind create cluster --config kind-config.yaml
# Delete cluster: kind delete cluster --name reliability-lab
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: reliability-lab
nodes:
  - role: control-plane
    # Expose the ingress controller on host port 80 and 443
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
