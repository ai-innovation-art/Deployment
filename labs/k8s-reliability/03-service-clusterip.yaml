# ClusterIP Service — reachable only from inside the cluster.
# Provides a stable virtual IP and DNS name for the reliability-api pods.
# DNS: reliability-api.default.svc.cluster.local:80
apiVersion: v1
kind: Service
metadata:
  name: reliability-api
  labels:
    app.kubernetes.io/name: reliability-api
spec:
  type: ClusterIP          # default; virtual IP only reachable inside the cluster
  selector:
    app.kubernetes.io/name: reliability-api   # matches pods from the Deployment
  ports:
    - name: http
      protocol: TCP
      port: 80             # the port clients use
      targetPort: 8000     # the containerPort the app listens on
