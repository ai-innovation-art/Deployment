# NodePort Service — exposes the app on every node's IP at a static port.
# Reachable from outside the cluster at: <NodeIP>:30800
# In kind, use: kubectl port-forward or access via the kind control-plane container IP.
apiVersion: v1
kind: Service
metadata:
  name: reliability-api-nodeport
  namespace: default
  labels:
    app.kubernetes.io/name: reliability-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: reliability-api
  ports:
    - name: http
      protocol: TCP
      port: 80           # ClusterIP port (for intra-cluster access)
      targetPort: 8000   # pod port
      nodePort: 30800    # host port — must be in range 30000-32767
