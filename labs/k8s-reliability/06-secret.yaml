# Secret — stores sensitive data.
# WARNING: base64 is ENCODING, not ENCRYPTION.
# Anyone with get/list rights to this Secret can decode it instantly.
# Protect Secrets with RBAC (09-rbac.yaml) and enable encryption-at-rest in production.
#
# Generate values:
#   echo -n "postgresql://admin:changeme@postgres:5432/reliability" | base64
apiVersion: v1
kind: Secret
metadata:
  name: reliability-api-secret
  labels:
    app.kubernetes.io/name: reliability-api
type: Opaque
data:
  # base64 of: postgresql://admin:changeme@postgres:5432/reliability
  DATABASE_URL: cG9zdGdyZXNxbDovL2FkbWluOmNoYW5nZW1lQHBvc3RncmVzOjU0MzIvcmVsaWFiaWxpdHk=
  # base64 of: s3cr3t-api-key-replace-me
  API_KEY: czNjcjN0LWFwaS1rZXktcmVwbGFjZS1tZQ==
