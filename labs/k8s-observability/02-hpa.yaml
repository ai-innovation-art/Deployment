# HorizontalPodAutoscaler (HPA) for reliability-api
# Scales replicas based on observed CPU utilization from the Metrics API.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reliability-api-hpa
  labels:
    app.kubernetes.io/name: reliability-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reliability-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # Scale out when average CPU exceeds 50% of request (50m of 100m)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # React immediately to traffic spikes
      policies:
        - type: Percent
          value: 100 # Double replica count if needed
          periodSeconds: 15
        - type: Pods
          value: 2 # Or add at least 2 pods every 15s
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60 # Wait 60s of calm traffic before scaling down (anti-flapping!)
      policies:
        - type: Percent
          value: 50 # Halve replicas at most
          periodSeconds: 30
