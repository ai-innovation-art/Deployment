# QuickBite on plain Docker: the "before Kubernetes" baseline.
#   docker compose up -d --build     then open http://localhost:8080
# Everything you see here gets a Kubernetes equivalent in labs/k8s-deep.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickbite
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  db-migrate:                       # K8s: initContainer of orders-api
    build: ./services/orders-api
    image: kumawatsunil/quickbite-orders-api:1.0
    command: ["python", "-m", "app.migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  menu-api:
    build: { context: ./services/menu-api, args: { APP_VERSION: "1.0" } }
    image: kumawatsunil/quickbite-menu-api:1.0
    depends_on: [redis]

  orders-api:
    image: kumawatsunil/quickbite-orders-api:1.0
    depends_on: { db-migrate: { condition: service_completed_successfully } }

  notifier:
    build: ./services/notifier
    image: kumawatsunil/quickbite-notifier:1.0
    depends_on: [redis]

  daily-report:                     # K8s: CronJob. Here: run manually with
    build: ./services/daily-report  #   docker compose run --rm daily-report
    image: kumawatsunil/quickbite-daily-report:1.0
    profiles: ["jobs"]
    depends_on: [postgres]

  web:
    build: ./services/web
    image: kumawatsunil/quickbite-web:1.0
    ports: ["8080:8080"]
    depends_on: [menu-api, orders-api]

volumes:
  pgdata:
