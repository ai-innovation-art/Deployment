# web: nginx serves the static UI and reverse-proxies /api/* to the backend services.
# "menu-api" and "orders-api" are DNS names:
#   - in docker compose they resolve via Docker's embedded DNS (127.0.0.11)
#   - in Kubernetes they resolve via CoreDNS to the Service's ClusterIP
server {
    listen 8080;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/menu    { proxy_pass http://menu-api:8000/menu; }
    location /api/version { proxy_pass http://menu-api:8000/version; }
    location /api/orders  { proxy_pass http://orders-api:8000/orders; }
}
