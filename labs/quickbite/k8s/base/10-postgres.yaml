# postgres: the system of record. Stateful, so it is a StatefulSet, not a Deployment.
#   - stable name:     postgres-0 (not postgres-7d9f8-xk2p)
#   - stable storage:  PVC data-postgres-0 survives pod deletion
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quickbite
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: quickbite }
spec:
  clusterIP: None            # headless: DNS returns the pod IP directly
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: quickbite
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: quickbite, tier: data }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: quickbite, tier: data }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: quickbite-config, key: DB_NAME } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
