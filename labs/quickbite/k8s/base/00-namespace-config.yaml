# Namespace: one "folder" for everything QuickBite owns.
apiVersion: v1
kind: Namespace
metadata:
  name: quickbite
  labels:
    app.kubernetes.io/part-of: quickbite
---
# ConfigMap: non-secret settings shared by several services.
# Changing a value here does NOT restart pods. You must roll them (Chapter 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickbite-config
  namespace: quickbite
data:
  DB_HOST: postgres          # DNS name of the postgres Service
  DB_NAME: quickbite
  REDIS_HOST: redis          # DNS name of the redis Service
  CACHE_TTL_SECONDS: "30"
---
# Secret: database credentials. stringData is plain text in the file;
# the API server stores it base64-encoded. That is NOT encryption (Chapter 7).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: quickbite
type: Opaque
stringData:
  username: quickbite
  password: quickbite-dev-password
