# redis: cache for menu-api + event queue between orders-api and notifier.
# A Deployment here because we accept losing it (a cache, not a source of truth).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: quickbite
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: quickbite }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: quickbite
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: quickbite, tier: data }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: quickbite, tier: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
